name: CI Pipeline (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Modificar README.md
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH_NAME" >> README.md
          
      - name: Hacer commit y push del README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "docs: actualizar README con nueva feature [skip ci]" || echo "No hay cambios"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar DEV_TOKEN contra variable local
        shell: powershell
        run: |
          Write-Output "Validando token de desarrollo..."
          if ("${{ secrets.DEV_TOKEN }}" -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "✅ Validación exitosa. Los tokens coinciden."
          } else {
            Write-Error "❌ Error: Los tokens no coinciden."
            exit 1
          }
